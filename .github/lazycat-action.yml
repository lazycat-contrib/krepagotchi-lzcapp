version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: web

build:
  run_buildscript: false

images:
  # 版本源镜像：上游使用 vMAJOR.MINOR 两段式 tag，映射为 MAJOR.MINOR.0 SemVer
  - id: web
    target: service
    service: web
    source: ghcr.io/danielbrendel/krepagotchi-game
    channel: custom
    sort: semver
    tag_regex: '^v\d+\.\d+$'
    version_regex: '^v(?P<version>\d+\.\d+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
  # 数据库镜像：固定 11.4 LTS 家族，仅自动跟进补丁版本
  - id: db
    target: service
    service: db
    source: library/mariadb
    channel: stable
    sort: semver
    tag_regex: '^11\.4(\.\d+)?$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Krepagotchi
    summary: "像素风虚拟宠物游戏：喂食、清洁、玩耍、治疗，照顾你的小 Krepa"
